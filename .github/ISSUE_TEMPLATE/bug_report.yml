name: Bug Report
description: Something is not working correctly
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Before filing:** Search [existing issues](https://github.com/4ciki/arbiter-mcp/issues) to avoid duplicates.

  - type: input
    id: version
    attributes:
      label: Python version and OS
      placeholder: "Python 3.12, Ubuntu 22.04 / Windows 11 / macOS 14"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered steps. Minimal reproducible example preferred.
      placeholder: |
        1. Set env var X to Y
        2. Run `python -m pytest tests/test_foo.py`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Error message / traceback
      description: Paste the full traceback. Redact any real credentials.
      render: shell
    validations:
      required: false

  - type: textarea
    id: env
    attributes:
      label: Relevant environment variables
      description: Paste relevant .env keys with values redacted.
      placeholder: |
        JIRA_URL=<redacted>
        LLM_PROVIDER=groq
      render: shell
    validations:
      required: false
