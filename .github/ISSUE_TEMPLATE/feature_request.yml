name: Feature Request
description: Propose a new capability, adapter, or improvement
labels: ["enhancement", "needs-discussion"]
body:
  - type: markdown
    attributes:
      value: |
        **Wait for an `approved` label before writing code.** This prevents effort on features that will not be merged.

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New adapter (Zendesk, ServiceNow, Linear, etc.)
        - New LangGraph node
        - LLM / model support
        - Scoring / retrieval improvement
        - API / MCP server endpoint
        - Dashboard / UI
        - Documentation
        - DevOps / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What workflow is broken, missing, or painful today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should Arbiter MCP do differently or additionally?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you consider? Why is this the right approach?
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: This change does not weaken the `risk_override` safety rule
          required: true
        - label: This change does not add telemetry or tracking
          required: true
