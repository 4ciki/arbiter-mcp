# Render.com deployment configuration for Arbiter MCP
# Two independent services deployed from the same monorepo.
#
# ┌──────────────────────────────────────────────────────────┐
# │  arbiter-backend  →  FastAPI + MCP server (Python)       │
# │  arbiter-frontend →  React SPA (nginx static host)       │
# └──────────────────────────────────────────────────────────┘
#
# Deploy at: https://dashboard.render.com/new/web-service
# Connect your GitHub repo (4ciki/arbiter-mcp) and Render auto-detects this file.
#
# IMPORTANT: After deploying the backend first, copy its URL
# (e.g. https://arbiter-backend.onrender.com) and set it as
# VITE_API_URL in the frontend service env vars, then re-deploy the frontend.
#
# Free tier note: Render free web services spin down after 15min inactivity.
# Upgrade to Starter ($7/mo) for always-on. For Smithery testing, free is fine.

services:
  # ─── Backend: FastAPI + MCP server ─────────────────────────────────────────
  - type: web
    name: arbiter-backend
    runtime: docker
    # Docker context is the backend/ subfolder — only backend code is built
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon

    # Health check — Render uses this to confirm the service is live
    healthCheckPath: /health

    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        value: sqlite:///./arbiter.db
      - key: PORT
        value: "8000"

      # ── Optional: add these in Render Dashboard for full functionality ──
      # - key: JIRA_SITE_URL
      #   value: https://yourorg.atlassian.net
      # - key: JIRA_EMAIL
      #   value: you@yourorg.com
      # - key: JIRA_API_TOKEN
      #   sync: false   # set as secret in Render dashboard
      # - key: SLACK_BOT_TOKEN
      #   sync: false
      # - key: SLACK_SIGNING_SECRET
      #   sync: false
      # - key: GROQ_API_KEY
      #   sync: false
      # - key: GCP_PROJECT_ID
      #   value: your-gcp-project
      # - key: SUPABASE_URL
      #   sync: false
      # - key: SUPABASE_KEY
      #   sync: false

  # ─── Frontend: React SPA served via nginx ───────────────────────────────────
  - type: web
    name: arbiter-frontend
    runtime: docker
    # Docker context is the frontend/ subfolder — only frontend code is built
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    region: oregon

    envVars:
      # !! Set this to your deployed backend URL BEFORE deploying the frontend !!
      # Example: https://arbiter-backend.onrender.com
      - key: VITE_API_URL
        value: https://arbiter-mcp-backend.onrender.com

      # Firebase config — set as secrets in Render Dashboard
      # - key: VITE_FIREBASE_API_KEY
      #   sync: false
      # - key: VITE_FIREBASE_AUTH_DOMAIN
      #   sync: false
      # - key: VITE_FIREBASE_PROJECT_ID
      #   sync: false
      # - key: VITE_FIREBASE_STORAGE_BUCKET
      #   sync: false
      # - key: VITE_FIREBASE_MESSAGING_SENDER_ID
      #   sync: false
      # - key: VITE_FIREBASE_APP_ID
      #   sync: false
