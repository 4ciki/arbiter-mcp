# Smithery configuration for Arbiter MCP
# https://smithery.ai/docs/build/publish

name: "Arbiter MCP"
displayName: "Arbiter MCP"
description: "AI-powered Slack to Jira ticket triage agent. Classifies IT ticket severity (P0-P3), auto-resolves safe tickets, and escalates critical incidents to humans via Slack. Zero false-positive auto-resolutions. Built with LangGraph, MCP, FastAPI, and ChromaDB."
homepage: "https://github.com/4ciki/arbiter-mcp"
repository: "https://github.com/4ciki/arbiter-mcp"
icon: "https://raw.githubusercontent.com/4ciki/arbiter-mcp/main/arbiter-mcp-ai-agent-icon.png"
iconUrl: "https://raw.githubusercontent.com/4ciki/arbiter-mcp/main/arbiter-mcp-ai-agent-icon.png"

startCommand:
  type: stdio
  commandFunction: |-
    (config) => ({
      command: "python",
      args: ["-m", "mcp_server"],
      env: {
        JIRA_SITE_URL:        config.jiraSiteUrl        || "",
        JIRA_EMAIL:           config.jiraEmail          || "",
        JIRA_API_TOKEN:       config.jiraApiToken       || "",
        SLACK_BOT_TOKEN:      config.slackBotToken      || "",
        SLACK_SIGNING_SECRET: config.slackSigningSecret || "",
        GROQ_API_KEY:         config.groqApiKey         || "",
        GCP_PROJECT_ID:       config.gcpProjectId       || "",
        DATABASE_URL:         "sqlite:///./arbiter.db",
        LOG_LEVEL:            "INFO"
      }
    })

configSchema:
  type: object
  required: []
  properties:
    jiraSiteUrl:
      type: string
      description: "Jira Cloud site URL (e.g. https://yourorg.atlassian.net). Leave empty for offline/demo mode."
    jiraEmail:
      type: string
      description: "Jira account email for API authentication."
    jiraApiToken:
      type: string
      description: "Jira API token (from id.atlassian.com/manage-profile/security/api-tokens)."
    slackBotToken:
      type: string
      description: "Slack bot token (xoxb-...) for posting escalation cards."
    slackSigningSecret:
      type: string
      description: "Slack app signing secret for HMAC-SHA256 webhook verification."
    groqApiKey:
      type: string
      description: "Groq API key for LLM classification. Free tier sufficient."
    gcpProjectId:
      type: string
      description: "Google Cloud project ID for Vertex AI summaries. Optional."
