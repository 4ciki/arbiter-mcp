services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arbiter-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
      - db_data:/app/db_data
    environment:
      - DATABASE_URL=sqlite:////app/db_data/arbiter.db
      - CHROMA_PATH=/app/chroma_data
      - PORT=8000
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: arbiter-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  chroma_data:
    driver: local
  db_data:
    driver: local
